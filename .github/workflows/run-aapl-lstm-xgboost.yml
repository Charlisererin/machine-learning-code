name: Run AAPL LSTM XGBoost First Round

on:
  push:
    branches:
      - chatgpt/stock-price-prediction
    paths:
      - stock_prediction/run_aapl_lstm_xgboost_first_round.py
      - .github/workflows/run-aapl-lstm-xgboost.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy scipy scikit-learn torch xgboost matplotlib joblib

      - name: Run experiment
        run: |
          python stock_prediction/run_aapl_lstm_xgboost_first_round.py

      - name: Show metrics
        run: |
          cat artifact/Stock_AAPL_FirstRound/results/metrics_test.csv
          cat artifact/Stock_AAPL_FirstRound/experiment_summary.json

      - name: Package
        run: |
          cd artifact
          zip -qr Stock_AAPL_FirstRound.zip Stock_AAPL_FirstRound
          ls -lh Stock_AAPL_FirstRound.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stock_AAPL_FirstRound
          path: artifact/Stock_AAPL_FirstRound.zip
          if-no-files-found: error
          retention-days: 7
